version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 18
    commands:
      - echo "Installing AWS CDK..."
      - npm install -g aws-cdk
      - echo "Installing Python dependencies..."
      - cd backend/infrastructure
      - pip install -r requirements.txt
      - cd $CODEBUILD_SRC_DIR

  build:
    commands:
      - echo "Building Stripe Lambda layer..."
      - mkdir -p backend/layers/stripe/python
      - pip install stripe -t backend/layers/stripe/python/
      - cd backend/layers/stripe
      - zip -r stripe-layer.zip python/
      - cd $CODEBUILD_SRC_DIR
      - echo "Verifying Stripe layer was created..."
      - ls -la backend/layers/stripe/stripe-layer.zip
      
      # ✅ CRITICAL FIX: Export environment variables for CDK
      - echo "Exporting Google OAuth credentials..."
      - export GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
      - export GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
      
      - echo "Synthesizing CDK stacks..."
      - cd backend/infrastructure
      - cdk synth
      - echo "Deploying all stacks..."
      - cdk deploy --all --require-approval never

  post_build:
    commands:
      - echo "Build completed successfully!"